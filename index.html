<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>LinguaReader Pro - تعلم اللغات بالقراءة الذكية</title>
    <meta name="description" content="منصة عالمية لتعليم اللغات بالقراءة الذكية مع ترجمة فورية، نطق صوتي، ونظام المفردات الذكي (SRS)" />
    
    <!-- PWA & Mobile Capabilities -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LinguaReader" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LinguaReader Pro - تعلم اللغات بالقراءة الذكية" />
    <meta property="og:description" content="منصة عالمية لتعليم اللغات بالقراءة الذكية مع ترجمة فورية، نطق صوتي، ونظام المفردات الذكي (SRS)" />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinguaReader Pro" />
    <meta name="twitter:description" content="منصة عالمية لتعليم اللغات بالقراءة الذكية مع ترجمة فورية، نطق صوتي، وتكرار متباعد" />

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LinguaReader Pro",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "منصة عالمية لتعليم اللغات بالقراءة الذكية مع ترجمة فورية، نطق صوتي، ونظام المفردات الذكي (SRS)"
    }
    </script>

    <!-- Web Fonts for Refined Reading Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GSI) Client -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
